<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="transition"></div>

<header>
  <h2>zed<span>.</span></h2>

  <button class="back-btn magnetic" onclick="goBack()">← Back</button>

  <nav id="nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
  </nav>
</header>

<main id="main-content">
  <section class="work">

    <h1 class="title">My Work</h1>
    <p class="subtitle">Selected design projects</p>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterWork('all', event)">All</button>
      <button class="filter-btn" onclick="filterWork('brand', event)">Branding</button>
      <button class="filter-btn" onclick="filterWork('ui', event)">UI Design</button>
      <button class="filter-btn" onclick="filterWork('social', event)">Social Media</button>
    </div>

    <div class="work-grid">

      <div class="work-card magnetic" data-type="brand" role="button" tabindex="0" onclick="openCase('brand')">
        <img src="brand identity (2).jpeg" alt="Brand identity project">
        <div class="work-info"><h3>Brand Identity</h3></div>
      </div>

      <div class="work-card magnetic" data-type="ui" role="button" tabindex="0" onclick="openCase('ui')">
        <img src="website ui (2).jpeg" alt="Website UI design project">
        <div class="work-info"><h3>Website UI</h3></div>
      </div>

      <div class="work-card magnetic" data-type="social" role="button" tabindex="0" onclick="openCase('social')">
        <img src="social media design.jpeg" alt="Social media design project">
        <div class="work-info"><h3>Social Media</h3></div>
      </div>

    </div>

  </section>
</main>

<script src="script.js"></script>
